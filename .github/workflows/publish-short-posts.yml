name: Redeemed Hacker Pro - Short Posts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of posts to attempt (1-5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
  schedule:
    - cron: "17 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  group: short-post-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and check posts
        env:
          REQUESTED_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: |
          python scripts/generate_posts.py --limit "$REQUESTED_LIMIT"

      - name: Save new posts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts content/published_manifest.json
            git commit -m "Publish cybersecurity awareness posts"
            git push
          else
            echo "No new posts passed the checks."
          fi
